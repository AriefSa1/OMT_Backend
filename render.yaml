services:
  - type: web
    name: omt-backend
    runtime: node
    region: singapore
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ALLOWED_ORIGINS
        value: https://94media.art,https://www.94media.art
      - key: GEMINI_API_KEY
        sync: false
      # Kode undangan untuk pendaftaran akun. Tanpa ini, pendaftaran mandiri tertutup
      # (kecuali user pertama saat basis data masih kosong). Isi di dashboard Render lalu
      # bagikan hanya ke orang yang boleh punya akun.
      - key: REGISTRATION_SECRET
        sync: false
      # Token bot Telegram (dari BotFather) untuk fitur notifikasi. Discord tak perlu ini —
      # memakai webhook per pengguna. Kosongkan bila belum memakai Telegram.
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      # Hermes Agent (analisa berbasis bukti). `127.0.0.1` hanya untuk dev lokal — di Render
      # arahkan ke endpoint yang terjangkau publik (mis. OpenRouter yang OpenAI-compatible,
      # atau Cloudflare Tunnel ke Hermes lokal). Tanpa ini fitur Hermes menjawab NOT_CONFIGURED.
      - key: HERMES_AGENT_ENABLED
        value: "true"
      - key: HERMES_AGENT_BASE_URL
        value: https://hermes.ninetyfour.fun/v1
      - key: HERMES_AGENT_API_KEY
        sync: false
      - key: HERMES_AGENT_MODEL
        value: upstage/solar-pro4:free
      # Opsional: batas request paralel saat agregasi KPI Product Performance (default 4).
      - key: SHOPEE_PRODUCT_PERFORMANCE_CONCURRENCY
        sync: false
